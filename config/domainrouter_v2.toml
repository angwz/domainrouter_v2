# DomainRouter v2 构建配置（维护者的 profile）。字段说明见 docs/guide/configuration.md。
schema_version = 1
project_root = ".."

[paths]
rules = "my.wei"
groups = "subconverter_config/groups.toml"
state = ".cache/domainrouter_v2"

[output]
directory = "dist"
# 发布地址：release 分支的固定路径。
base_url = "https://raw.githubusercontent.com/angwz/domainrouter_v2/release"
interval_seconds = 21600
# 同时发布 domain/ipcidr 的 MRS（需要先运行 domainrouter_v2 tools prepare）。
mrs = true
