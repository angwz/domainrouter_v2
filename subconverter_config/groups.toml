# ===== 外层 fallback：负责自动切换 =====
[[custom_groups]]
expected-status = "204" # 只认 204，排除劫持/认证页
interval = 97 
lazy = false 
max-failed-times = 3 # 连续失败 3 次就立即重测
name = "🛫 香港专线" 
rule = ["[]🎇 香港高速", "[]🧊 新加坡专线"] 
timeout = 2500 # 毫秒；亚洲线路可以设得更短
type = "fallback" 
url = "https://www.gstatic.com/generate_204" 
# hidden = true           # 需要面板支持；不手动操作的组可以隐藏

[[custom_groups]]
expected-status = "204"
interval = 127
lazy = false
max-failed-times = 3
name = "🌺 日本专线"
rule = ["[]🗾 日本高速", "[]⛳ 美国专线"]
timeout = 2500
type = "fallback"
url = "https://www.gstatic.com/generate_204"

[[custom_groups]]
expected-status = "204"
interval = 177
lazy = false
max-failed-times = 3
name = "🧊 新加坡专线"
rule = ["[]🦁 新加坡高速", "[]⛳ 美国专线"]
timeout = 2500
type = "fallback"
url = "https://www.gstatic.com/generate_204"

[[custom_groups]]
expected-status = "204" 
interval = 233 
lazy = false 
max-failed-times = 3 
name = "⛳ 美国专线" 
rule = [
  "[]🏞️ 美利坚高速",
  '\A[^|]*(?:美|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(?<![A-Za-z])(?i:US)(?![A-Za-z])|(?<![A-Za-z])(?i:United ?States)(?![A-Za-z]))[^|]*(?:\||\z)',
  "[]🦁 新加坡高速",
] 
timeout = 3500 # 跨太平洋 RTT 高，留宽一点，避免误判
type = "fallback" 
url = "https://www.gstatic.com/generate_204" 

# ===== 内层 select：负责手动选节点 =====
[[custom_groups]]
empty-fallback = "REJECT" # 正则一个节点都没匹配到时，不放行流量
name = "🎇 香港高速" 
rule = [
  '\A[^|]*(?:香港|港|(?<![A-Za-z])(?i:HK)(?![A-Za-z])|(?<![A-Za-z])(?i:Hong ?Kong)(?![A-Za-z]))[^|]*(?:\||\z)',
  "[]⛳ 美国专线",
] 
type = "select" 

[[custom_groups]]
empty-fallback = "REJECT" # 正则一个节点都没匹配到时，不放行流量
name = "🗾 日本高速" 
rule = [
  '\A(?![^|]*尼日利亚)[^|]*(?:日本|日|东京|大阪|埼玉|(?<![A-Za-z])(?i:JP)(?![A-Za-z])|(?<![A-Za-z])(?i:Japan)(?![A-Za-z]))[^|]*(?:\||\z)',
  "[]⛳ 美国专线",
] 
type = "select" 

[[custom_groups]]
empty-fallback = "REJECT" # 正则一个节点都没匹配到时，不放行流量
name = "🦁 新加坡高速" 
rule = [
  '\A(?![^|]*(?:新西兰|新几内亚))[^|]*(?:新加坡|新|坡|狮城|(?<![A-Za-z])(?i:SG)(?![A-Za-z])|(?<![A-Za-z])(?i:Singapore)(?![A-Za-z]))[^|]*(?:\||\z)',
  "[]🏞️ 美利坚高速",
] 
type = "select" 

[[custom_groups]]
empty-fallback = "REJECT" # 正则一个节点都没匹配到时，不放行流量
name = "🏞️ 美利坚高速" 
rule = [
  '\A[^|]*(?:美|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(?<![A-Za-z])(?i:US)(?![A-Za-z])|(?<![A-Za-z])(?i:United ?States)(?![A-Za-z]))[^|]*(?:\||\z)',
] 
type = "select"
